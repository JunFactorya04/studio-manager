<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khách chọn ảnh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0060DF;text-decoration:none}a:hover{color:#004BB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; padding: 56px 0 0;">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
<a href="ProjectDetail.dc.html" aria-label="Đóng chế độ xem của khách" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center; color: #000000;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<span style="font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: #3C3C43;">[TÊN STUDIO]</span>
<button aria-label="Tải về ảnh đã chọn" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center; color: #000000; padding: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg></button>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px;">Lan &amp; Minh</h1>
<span style="font-size: 15px; color: #6C6C70;">Ảnh cưới · 412 ảnh · hết hạn chọn 04/11</span>
</div>

<div role="tablist" aria-label="Lọc ảnh" style="margin: 14px 16px 12px; height: 36px; border-radius: 18px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); box-sizing: border-box;">
<button role="tab" aria-selected="true" style="border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.10); font: inherit; font-size: 14px; font-weight: 600; color: #000000;">Tất cả</button>
<button role="tab" aria-selected="false" style="border: 0; border-radius: 16px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #000000;">Đã chọn 24</button>
<button role="tab" aria-selected="false" style="border: 0; border-radius: 16px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #000000;">Chưa chọn</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="15">
<div style="aspect-ratio: 1; background: {{t.bg}}; position: relative;">
<span style="position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.55);">© Studio</span>
<sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; border: 3px solid #0060DF; box-sizing: border-box;"></div>
<button aria-label="Bỏ chọn {{t.name}}" aria-pressed="true" style="position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #D92D20; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.15);"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
<button aria-label="Chọn {{t.name}}" aria-pressed="false" style="position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: #1C1C1E; padding: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
</sc-if>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.82); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid rgba(0,0,0,0.08); box-shadow: 0 8px 28px rgba(0,0,0,0.14); display: flex; align-items: center; gap: 12px; padding: 0 10px 0 22px; box-sizing: border-box;">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 15px; font-weight: 600;">24 / 60 ảnh</span>
<div style="height: 4px; border-radius: 2px; background: #E5E5EA; overflow: hidden;"><div style="width: 40%; height: 4px; background: #0060DF;"></div></div>
</div>
<button style="height: 52px; padding: 0 22px; border-radius: 26px; border: 0; background: #0060DF; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600;">Gửi lựa chọn</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bgs = ['#D8CFC4','#C7CED6','#DCD3C6','#CFC8D8','#C6CEC2','#E2DBD1','#CBC3B8','#D3D7DC','#D6CDC0','#C9D1CB','#DDD4C9','#CCC6D2','#D1CBC1','#C4CCD4','#DAD2C6'];
const picked = [0, 3, 4, 8, 11];
const tiles = bgs.map((bg, i) => {
const sel = picked.indexOf(i) !== -1;
return { bg: bg, sel: sel, off: !sel, name: 'ảnh ' + (412 + i) };
});
return { tiles: tiles, false: false, true: true };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thư viện ảnh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0060DF;text-decoration:none}a:hover{color:#004BB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; padding: 56px 0 0;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 16px;">
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px;">Thư viện</h1>
<div style="display: flex; gap: 10px; padding-bottom: 2px;">
<button aria-label="Chọn nhiều ảnh" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0.5px solid rgba(0,0,0,0.06); background: rgba(255,255,255,0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.06); font: inherit; font-size: 15px; font-weight: 600; color: #000000;">Chọn</button>
<a href="Import.dc.html" aria-label="Nhập ảnh từ thẻ nhớ" style="width: 44px; height: 44px; border-radius: 22px; background: #0060DF; box-shadow: 0 2px 8px rgba(0,96,223,0.25); display: flex; align-items: center; justify-content: center; color: #FFFFFF;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM10 3v4M13 3v4"/></svg></a>
</div>
</div>

<div style="margin: 12px 16px 0; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; font-size: 13px;">
<div style="flex: 1; display: flex; flex-direction: column; gap: 5px;"><div style="display: flex; justify-content: space-between;"><span style="font-weight: 600;">NAS studio</span><span style="color: #6C6C70;">9,9 / 16 TB</span></div><div style="height: 5px; border-radius: 3px; background: #E5E5EA; overflow: hidden;"><div style="width: 62%; height: 5px; background: #34A853;"></div></div></div>
<div style="width: 0.5px; align-self: stretch; background: #D1D1D6;"></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 600;">Cloud preview</span><span style="color: #1E6B34;">Đã đồng bộ</span></div>
</div>

<div role="tablist" aria-label="Trạng thái chọn lọc" style="margin: 12px 16px 0; height: 36px; border-radius: 18px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); box-sizing: border-box;">
<button role="tab" aria-selected="true" style="border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.10); font: inherit; font-size: 14px; font-weight: 600; color: #000000;">Tất cả</button>
<button role="tab" aria-selected="false" style="border: 0; border-radius: 16px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #000000;">Giữ</button>
<button role="tab" aria-selected="false" style="border: 0; border-radius: 16px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #000000;">Loại</button>
<button role="tab" aria-selected="false" style="border: 0; border-radius: 16px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #000000;">Chưa xem</button>
</div>

<a href="ProjectDetail.dc.html" style="display: flex; justify-content: space-between; align-items: baseline; padding: 18px 16px 8px; color: #000000;"><span style="font-size: 17px; font-weight: 600;">Lan &amp; Minh · 18/10</span><span style="font-size: 13px; color: #6C6C70;">624 cặp RAW + JPG</span></a>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;">
<sc-for list="{{tilesA}}" as="t" hint-placeholder-count="12">
<div style="aspect-ratio: 1; background: {{t.bg}}; position: relative; opacity: {{t.op}};">
<span style="position: absolute; left: 4px; bottom: 4px; font-size: 11px; font-weight: 600; color: #FFFFFF; background: rgba(0,0,0,0.55); padding: 1px 5px; border-radius: 5px;">RAW+JPG</span>
<sc-if value="{{t.pick}}" hint-placeholder-val="{{false}}">
<span aria-label="Giữ" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 11px; background: #1E8E3E; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
</sc-if>
<sc-if value="{{t.rej}}" hint-placeholder-val="{{false}}">
<span aria-label="Loại" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 11px; background: #D92D20; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
</sc-if>
<sc-if value="{{t.star}}" hint-placeholder-val="{{false}}">
<span aria-label="Đánh giá 5 sao" style="position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 11px; background: rgba(0,0,0,0.55); color: #FFD60A; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></svg></span>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 18px 16px 8px;"><span style="font-size: 17px; font-weight: 600;">Hội thảo ABC · 12/10</span><span style="font-size: 13px; color: #6C6C70;">310 cặp RAW + JPG</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;">
<sc-for list="{{tilesB}}" as="t" hint-placeholder-count="4">
<div style="aspect-ratio: 1; background: {{t.bg}}; position: relative;">
<span style="position: absolute; left: 4px; bottom: 4px; font-size: 11px; font-weight: 600; color: #FFFFFF; background: rgba(0,0,0,0.55); padding: 1px 5px; border-radius: 5px;">RAW+JPG</span>
</div>
</sc-for>
</div>

<nav aria-label="Điều hướng chính" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid rgba(0,0,0,0.06); box-shadow: 0 8px 28px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; box-sizing: border-box;">
<a href="Main.dc.html" style="width: 66px; height: 52px; border-radius: 26px; color: #3C3C43; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Tổng quan</a>
<a href="Projects.dc.html" style="width: 66px; height: 52px; border-radius: 26px; color: #3C3C43; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>Dự án</a>
<a href="Library.dc.html" aria-current="page" style="width: 66px; height: 52px; border-radius: 26px; background: rgba(0,96,223,0.12); color: #0060DF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Thư viện</a>
<a href="Inbox.dc.html" style="width: 66px; height: 52px; border-radius: 26px; color: #3C3C43; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; position: relative;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/></svg>Tin nhắn<span style="position: absolute; top: 3px; right: 14px; min-width: 18px; height: 18px; border-radius: 9px; background: #D92D20; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">4</span></a>
<a href="Finance.dc.html" style="width: 66px; height: 52px; border-radius: 26px; color: #3C3C43; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>Tài chính</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const a = ['#D8CFC4','#C7CED6','#DCD3C6','#CFC8D8','#C6CEC2','#E2DBD1','#CBC3B8','#D3D7DC','#D6CDC0','#C9D1CB','#DDD4C9','#CCC6D2'];
const state = ['pick','pick','rej','none','pick','none','rej','pick','none','pick','none','none'];
const stars = [0, 4, 9];
const tilesA = a.map((bg, i) => ({
bg: bg,
pick: state[i] === 'pick',
rej: state[i] === 'rej',
star: stars.indexOf(i) !== -1,
op: state[i] === 'rej' ? 0.45 : 1
}));
const tilesB = ['#C4CCD4','#DAD2C6','#D1CBC1','#C9C3D0'].map((bg) => ({ bg: bg }));
return { tilesA: tilesA, tilesB: tilesB, false: false };
}
}
</script>
</body>
</html>

[package]
name = "studio-manager"
version = "0.1.0"
description = "Trình quản lý studio ảnh"
edition = "2021"

[lib]
name = "studio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# `tauri dev` builds in debug mode, where hashing and JPEG decoding are 10 to 30 times slower.
# Optimise the code that does the heavy work even in dev builds so imports run at near-release speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
